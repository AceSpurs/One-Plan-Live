<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One Plan Live</title>
</head>
<body>
<p id="boot" style="font-family:system-ui,sans-serif;padding:24px;color:#5c6b62">Loading One Plan Live…</p>
<script>
(async function(){
  const n = 4;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = await fetch("ssp-payload/p" + i + ".txt");
    if (!r.ok) throw new Error("chunk " + i + " HTTP " + r.status);
    parts.push(await r.text());
  }
  const b64 = parts.join("").replace(/\s+/g, "");
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream("gzip");
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(e => {
  const el = document.getElementById("boot");
  if (el) el.textContent = "Failed to load app: " + e;
});
</script>
</body>
</html>
